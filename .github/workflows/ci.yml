name: VORTEX CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke-and-contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JavaScript syntax
        run: |
          node --check site.js
          node --check site-config.js
          node --check netlify/functions/contact.mjs
      - name: Contact handler unit tests
        run: node test_contact.mjs
      - name: Static asset and config validation
        run: python3 scripts/check_static.py
